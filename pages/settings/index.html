<!doctype html>
<html lang="zh-CN" data-theme="light" data-palette="luxury">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>通用生图 · AstrBot 配置台</title>
  <link rel="stylesheet" href="./styles.css?v=20260628_provider_runtime" />
</head>
<body data-active-tab="overview">
  <div class="app-shell">
    <header class="top-bar">
      <a class="brand-lockup" href="#" aria-label="通用生图配置首页" data-tab-link="overview">
        <img class="brand-mark" src="./plugin_logo.png?v=20260621_plugin_logo_fix" alt="" />
        <span>RawImage</span>
      </a>

      <nav class="top-nav" id="topNav" aria-label="配置导航">
        <button class="nav-pill active" type="button" data-tab="overview">Dashboard</button>
        <button class="nav-pill" type="button" data-tab="generation">生成设置</button>
        <button class="nav-pill" type="button" data-tab="providers">供应商矩阵</button>
        <button class="nav-pill" type="button" data-tab="limits">权限额度</button>
        <button class="nav-pill" type="button" data-tab="tools">工具调用</button>
        <button class="nav-pill" type="button" data-tab="raw">Raw JSON</button>
      </nav>

      <div class="top-actions" aria-label="页面操作">
        <button id="paletteToggleBtn" class="icon-action" type="button" title="切换配色">
          <span id="paletteModeLabel">荧绿</span>
        </button>
        <button id="appearanceToggleBtn" class="icon-action" type="button" title="切换明暗">
          <span id="appearanceModeLabel">浅色</span>
        </button>
        <button id="reloadBtn" class="icon-action" type="button" title="刷新配置">
          <span>刷新</span>
        </button>
        <button id="saveAllBtn" class="save-button" type="button">保存全部</button>
      </div>
    </header>

    <main class="dashboard-stage">
      <section class="primary-pane" id="panelMount" aria-live="polite">
        <section class="loading-card">
          <span class="loading-dot"></span>
          <b>正在载入配置</b>
        </section>
      </section>

      <aside class="score-panel" id="scorePanel" aria-label="配置状态">
        <div class="score-heading">
          <p id="scoreKicker">GENERAL RAW IMAGE 2026</p>
          <h1 id="scoreTitle">Hello, AstrBot</h1>
          <span id="scoreHint">这里是你的生图控制台</span>
        </div>

        <div class="provider-tabs" id="providerTabs" aria-label="仪表盘快捷视图">
          <button type="button" class="active" data-score-mode="auto" aria-pressed="true">Auto</button>
          <button type="button" data-score-mode="model" aria-pressed="false">Model</button>
          <button type="button" data-score-mode="safety" aria-pressed="false">Safety</button>
        </div>

        <div class="score-meter">
          <div class="score-scale" aria-hidden="true">
            <span>300</span>
            <span>450</span>
            <span>580</span>
            <span>700</span>
            <span>850</span>
          </div>
          <div class="score-ring" id="scoreRing" aria-hidden="true">
            <svg class="score-ring-graphic" viewBox="0 0 360 246" focusable="false">
              <defs>
                <linearGradient id="scoreWarmGradient" x1="71" y1="210" x2="184" y2="54" gradientUnits="userSpaceOnUse">
                  <stop offset="0%" stop-color="#ff765e"></stop>
                  <stop offset="48%" stop-color="#ffb35a"></stop>
                  <stop offset="100%" stop-color="#ffdf59"></stop>
                </linearGradient>
              </defs>
              <path class="score-track" d="M 71.0 209.7 A 116 116 0 1 1 289.0 209.7"></path>
              <path class="score-segment score-warm" d="M 71.0 209.7 A 116 116 0 0 1 184.0 54.1"></path>
              <path class="score-segment score-green" d="M 223.5 62.4 A 116 116 0 0 1 292.6 198.1"></path>
              <path class="score-inner-guide" d="M 84.2 204.9 A 102 102 0 1 1 275.8 204.9"></path>
            </svg>
          </div>
          <div class="score-value">
            <span id="scoreDelta">+0 pts</span>
            <strong id="scoreNumber">803</strong>
          </div>
        </div>

        <button class="score-cta" id="quickSaveBtn" type="button">Update image config</button>

        <div class="insight-grid" id="insightGrid">
          <article class="insight-card">
            <span>供应商</span>
            <strong id="insightProviders">0</strong>
            <em>active adapters</em>
          </article>
          <article class="insight-card">
            <span>模型</span>
            <strong id="insightModels">0</strong>
            <em>available models</em>
          </article>
          <article class="insight-card">
            <span>并发</span>
            <strong id="insightConcurrency">0</strong>
            <em>parallel tasks</em>
          </article>
          <article class="insight-card">
            <span>超时</span>
            <strong id="insightTimeout">0s</strong>
            <em>global timeout</em>
          </article>
          <article class="insight-card">
            <span>额度</span>
            <strong id="insightLimits">Off</strong>
            <em>daily policy</em>
          </article>
          <article class="insight-card">
            <span>启动图</span>
            <strong id="insightImages">0</strong>
            <em>reply images</em>
          </article>
        </div>

        <section class="system-deck" aria-label="时间与系统信息">
          <article class="system-card clock-card">
            <span>LOCAL TIME</span>
            <strong id="runtimeClock">00:00</strong>
            <em id="runtimeDate">AstrBot Console</em>
          </article>
          <article class="system-card">
            <span>SYSTEM STATUS</span>
            <strong id="systemStatus">Ready</strong>
            <em id="systemSummary">waiting for schema</em>
          </article>
        </section>
      </aside>
    </main>
  </div>

  <div class="toast" id="toastLayer" role="status" aria-live="polite"></div>
  <script type="module" src="./app.js?v=20260628_provider_runtime"></script>
</body>
</html>
